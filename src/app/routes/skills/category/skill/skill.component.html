<span class="group/skill relative flex h-full items-center" [id]="skill.id">
  @if (user()?.admin) {
    <div
      class="absolute z-10 flex w-full justify-end transition-opacity group-hover/skill:opacity-100 lg:opacity-0"
    >
      <p-button
        [text]="true"
        (onClick)="onEdit.emit(skill)"
        icon="pi pi-pencil"
        size="small"
      />
      <p-button
        [text]="true"
        (onClick)="onRemove.emit(skill)"
        icon="pi pi-trash"
        size="small"
        severity="danger"
      />
    </div>
  }
  @if (skill.icon) {
    <img
      class="me-1"
      alt="skill icon"
      width="24"
      height="24"
      src="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/{{
        skill.icon.includes('dot-net') ? 'dot-net' : skill.icon.split('-')[0]
      }}/{{ skill.icon }}.svg"
    />
  } @else {
    <span class="font-extrabold mx-1">{{ skill.title[0].toUpperCase() }}</span>
  }
  <span
    [ngClass]="{
      'transition-opacity group-hover/skill:opacity-50':
        $safeNavigationMigration(user()?.admin),
    }"
  >
    {{ skill.title }}
  </span>
</span>
